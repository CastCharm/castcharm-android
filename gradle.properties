# AndroidX support
android.useAndroidX=true

# KSP incremental compilation breaks when editing via WSL and building in Windows Android Studio
ksp.incremental=false

# Dependency constraints configuration
android.dependency.useConstraints=false

# R8 Full Mode
android.r8.strictFullModeForKeepRules=false

# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Allow kotlin.sourceSets for compatibility with plugins like KSP in AGP 9.0
android.disallowKotlinSourceSets=false
